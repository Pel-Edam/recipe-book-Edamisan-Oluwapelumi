<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>FOOD TO IMAGINE</title>
</head>
<body>
    <header class="header"> 
       <div class="logo">
         <span class="logo-icon">🍽️</span>
         <span class="logo-text">
            FOOD TO IMAGINE
         </span>
       </div>
         <nav class="nav" id="nav">
    <a href="#" class="nav-link"> Home</a>
    <a href="#" class="nav-link"> Recommended Dishes</a>
    <a href="#" class="nav-link"> Ingredient List</a>
         </nav>
        <button aria-label="hamburger" class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>
    <section class="hero">
      <h1 class="hero-title">
        Discover & Save <span> Delicious recipes</span>
      </h1>
      <p class="hero-subtitle"> Cook Smarter. Eat better. Plan your meals with ease </p>
    </section>
    <main class="main">
      <div class="control">
<input type="text" class="search-input" id="searchInput" placeholder="Search for recipes"> 
<select aria-label="type" id="categoryFilter" class="category-select">
<option value="all">All</option>
<option value="breakfast">Breakfast</option>
<option value="lunch">Lunch</option>
<option value="dinner">Dinner</option>
<option value="snack">Snack</option>
<option value="dessert">Desert</option>
</select>
<button class="btn-add">Add Recipes</button>
      </div>
    <!-- JavaScript will inject recipe cards here -->
    <div class="recipe-grid" id="recipeGrid"></div>
    </main>
    <!-- ADD/EDIT RECIPE MODAL -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
 
        <button class="modal-close" id="modalClose">✕</button>
        <h2 id="modalTitle">Add New Recipe</h2>
 
        <div class="form-group">
            <label>Recipe Name</label>
            <input type="text" id="recipeName" placeholder="e.g. Jollof Rice">
        </div>
 
        <div class="form-group">
            <label>Category</label>
            <select id="recipeCategory">
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="snack">Snack</option>
                <option value="dessert">Dessert</option>
            </select>
        </div>
 
        <div class="form-group">
            <label>Cuisine</label>
            <input type="text" id="recipeCuisine" placeholder="e.g. Nigerian, Italian">
        </div>
 
        <div class="form-group">
            <label>Ingredients (one per line)</label>
            <textarea id="recipeIngredients" rows="5"
                      placeholder="Rice&#10;Tomatoes&#10;Onions"></textarea>
        </div>
 
        <div class="form-group">
            <label>Instructions</label>
            <textarea id="recipeInstructions" rows="4"
                      placeholder="Step by step..."></textarea>
        </div>
 
        <div class="form-group">
            <label>Emoji (optional)</label>
            <input type="text" id="recipeEmoji" placeholder="e.g. 🍚">
        </div>
        <button class="btn-submit" id="saveRecipeBtn">Save Recipe</button>
    </div>
    <!-- SHOPPING LIST SIDE PANEL -->
<div class="shopping-panel" id="shoppingPanel">
    <h2>Shopping List</h2>
    <div id="shoppingItems"></div>
    <button class="btn-close-panel" id="closeShoppingPanel">Close</button>
    <script type="" src="js/app.js"></script>
</div>
</div>
</body>
</html>
